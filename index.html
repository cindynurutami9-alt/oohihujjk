
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ruang Isyarat</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0B1F3A;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    background: white;
    width: 380px;
    padding: 35px;
    border-radius: 15px;
    text-align: center;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.logo {
    font-size: 55px;
    margin-bottom: 10px;
}

h1 {
    color: #142D4E;
    font-size: 30px;
}

.subtitle {
    color: #315B8A;
    margin-bottom: 30px;
}

h2 {
    color: #142D4E;
    margin-bottom: 10px;
}

.description {
    color: #666;
    margin-bottom: 25px;
}

form {
    text-align: left;
}

label {
    display: block;
    color: #142D4E;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 14px;
}

input:focus {
    outline: none;
    border-color: #315B8A;
}

button {
    width: 100%;
    padding: 13px;
    background: #142D4E;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #315B8A;
}

.footer {
    color: #777;
    font-size: 12px;
    margin-top: 25px;
    line-height: 1.5;
}

@media (max-width: 450px) {
    .login-container {
        width: 90%;
        padding: 25px;
    }
}

</style>
<body>

    <div class="login-container">

        <div class="logo">🤟</div>

        <h1>Ruang Isyarat</h1>
        <p class="subtitle">
            Belajar Bahasa Isyarat Indonesia
        </p>

        <h2>Selamat Datang!</h2>
        <p class="description">
            Silakan masuk untuk mulai belajar.
        </p>

        <form id="loginForm">

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Masukkan email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p class="footer">
            Belajar bahasa isyarat,
            berkomunikasi tanpa batas.
        </p>

    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            window.location.href = "dashboard.html";

        });
    </script>

</body>
</html>
