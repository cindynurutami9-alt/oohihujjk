
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abjad RuangIsyarat</title>
    <link rel="stylesheet" href="abjad.css">
</head>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0B1F3A;
    color: white;
}

.navbar {
    background: #09182D;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar a {
    color: white;
    text-decoration: none;
}

header {
    background: #142D4E;
    text-align: center;
    padding: 55px 20px;
}

header h1 {
    margin-bottom: 12px;
}

header p {
    color: #DCE6F1;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.gambar-abjad {
    background: white;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
}

.gambar-abjad img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
}

</style>
<body>

    <nav class="navbar">
        <h2>🤟 RuangIsyarat</h2>
        <a href="belajar.html">Kembali</a>
    </nav>

    <header>
        <h1>Abjad Bahasa Isyarat A-Z</h1>
        <p>Pelajari seluruh huruf alfabet bahasa isyarat.</p>
    </header>

    <main class="container">

        <div class="gambar-abjad">
            <img
                src="gambar.jpg"
                alt="Tabel lengkap abjad bahasa isyarat A sampai Z"
            >
        </div>

    </main>

</body>
</html>
